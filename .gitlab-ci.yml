stages:
  - deploy

pages:
  stage: deploy
  tags:
    - general-runner-shell
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build
    - mv dist public
    - cp public/index.html public/404.html
    - printf '%s\n' "$CI_PAGES_URL" > public/pages-url.txt
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
