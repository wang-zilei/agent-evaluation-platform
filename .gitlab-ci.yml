stages:
  - deploy

pages:
  stage: deploy
  image: node:22-alpine
  tags:
    - general-runner
  script:
    - npm ci
    - npm run build
    - mv dist public
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
